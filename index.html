<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>diskett.net</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }
        canvas {
            display: block;
        }
    </style>
    <style>
#fullpage-link {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 10; /* above canvas */
}
    </style>
    
</head>
<body>
    <a id="fullpage-link" href="https://youtube.com/playlist?list=PLQOOXDUwgmoUXLfAPXYBctHU06AOPXX_m"></a>
    <canvas id="canvas"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // Black background

        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        // Renderer
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas') });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Post-processing
        const composer = new THREE.EffectComposer(renderer);
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Create checkered ball with text
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        // Draw checkered pattern
        const size = 64;
        for (let x = 0; x < canvas.width; x += size) {
            for (let y = 0; y < canvas.height; y += size) {
                ctx.fillStyle = ((Math.floor(x / size) + Math.floor(y / size)) % 2 === 0) ? 'red' : 'white';
                ctx.fillRect(x, y, size, size);
            }
        }

        // Add text
        ctx.fillStyle = 'black';
        ctx.font = 'bold 60px Monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('diskett.net', canvas.width / 2, canvas.height / 2);

        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;
        const ballMaterial = new THREE.ShaderMaterial({
            uniforms: {
                tDiffuse: { value: texture },
                time: { value: 0.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vNormal;
                varying vec3 vViewDir;
                void main() {
                    vUv = uv;
                    vNormal = normalize(normalMatrix * normal);
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    vViewDir = normalize(-mvPosition.xyz);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float time;
                varying vec2 vUv;
                varying vec3 vNormal;
                varying vec3 vViewDir;
                void main() {
                    vec2 uv = vUv;
                    vec4 color = texture2D(tDiffuse, uv);
                    vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
                    float diff = max(dot(vNormal, lightDir), 0.0) * 0.8 + 0.2;
                    vec3 reflectDir = reflect(-lightDir, vNormal);
                    float spec = pow(max(dot(vViewDir, reflectDir), 0.0), 32.0) * 0.5;
                    gl_FragColor = color * diff + vec4(spec, spec, spec, 0.0);
                }
            `
        });
        const ballGeometry = new THREE.SphereGeometry(2, 32, 32);
        const ball = new THREE.Mesh(ballGeometry, ballMaterial);
        scene.add(ball);

        // Floor
        const floorGeometry = new THREE.PlaneGeometry(20, 20, 50, 50);
        const floorMaterial = new THREE.ShaderMaterial({
            uniforms: {
                ballPos: { value: new THREE.Vector3() }
            },
            vertexShader: `
                uniform vec3 ballPos;
                void main() {
                    vec3 pos = position;
                    float dist = distance(pos.xz, ballPos.xz);
                    float deform = exp(-dist * dist * 5.0) * 0.3; // Gaussian dent
                    pos.y -= deform;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                void main() {
                    gl_FragColor = vec4(0.0, 0.0, 0.5, 1.0); // Gray floor
                }
            `,
            side: THREE.DoubleSide
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 1.8;
        floor.position.y = -3;
        scene.add(floor);

        let time = 0;

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            ball.rotation.y -= 0.01; // Rotate the ball in opposite direction
            ball.position.y = Math.abs(Math.sin(time * 3.0)) * 1.5 - 1; // Bounce
            floorMaterial.uniforms.ballPos.value.copy(ball.position);
            time += 0.01;
            composer.render();
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
